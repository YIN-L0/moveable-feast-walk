<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="流动的盛宴">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<title>流动的盛宴 · 巴黎漫步</title>
</head>
<body>
<header>
  <h1>流动的盛宴</h1>
  <p id="status">尚未开始定位</p>
</header>

<section id="start">
  <button id="startBtn" class="primary">开始漫步</button>
  <p class="hint">需要允许定位（和指南针）。漫步时请保持本页在前台、屏幕常亮——锁屏后浏览器会停止定位。</p>
</section>

<section id="mapWrap">
  <div id="map"></div>
  <div class="mapBtns">
    <button id="fullBtn" aria-label="展开地图">⤢</button>
    <button id="locateBtn" aria-label="回到我的位置">◎</button>
    <button id="fitBtn" aria-label="显示全部地点">▦</button>
  </div>
  <button id="nextBanner" hidden></button>
</section>
<p class="legend"><i class="pin-s">2</i> 圆点里的数字 = 这个地点还没听的段落数　<i class="pin-s done">✓</i> 已全部听完　<i class="pin-s now">1</i> 正在播放</p>

<section>
  <div class="row between">
    <h2>地点</h2>
    <span class="row">
      <label class="toggle"><input type="checkbox" id="autoToggle" checked> 靠近自动播放</label>
      <label class="toggle"><input type="checkbox" id="introToggle" checked> 先讲背景</label>
    </span>
  </div>
  <ul id="places"></ul>
</section>

<section id="offline">
  <button id="cacheBtn">下载全部音频以便离线</button>
  <span id="cacheStatus"></span>
  <button id="resetBtn" class="link">重置“已听过”记录</button>
  <p class="hint">地图底图需要网络（看过的区域会自动缓存）；地点、文字和已下载的音频可完全离线。</p>
</section>

<aside id="player" hidden>
  <div class="row between">
    <div>
      <div id="nowPlace"></div>
      <div id="nowScene"></div>
    </div>
    <span id="phase" class="badge"></span>
  </div>
  <audio id="audio" controls preload="none"></audio>
  <div class="row">
    <button id="textBtn">背景与原文</button>
    <button id="skipBtn">跳过背景</button>
    <button id="stopBtn">停止</button>
  </div>
  <article id="sceneText" hidden></article>
</aside>

<dialog id="detail"></dialog>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
